<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Features</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="[overflow-wrap:anywhere] bg-white text-slate-900 p-4">
<main class="max-w-5xl mx-auto">
  <h1 class="text-3xl font-bold text-center mb-8">Features</h1>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="border border-slate-300 rounded-xl p-4 min-w-0"><svg role="img" class="w-8 h-8 text-blue-700" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg><h2 class="text-lg font-semibold mt-2">Fast</h2><p class="text-slate-700">Starts in an instant.</p></div>
    <div class="border border-slate-300 rounded-xl p-4 min-w-0"><svg aria-hidden="true" class="w-8 h-8 text-blue-700" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/></svg><h2 class="text-lg font-semibold mt-2">Small</h2><p class="text-slate-700">Fits on one screen.</p></div>
    <div class="border border-slate-300 rounded-xl p-4 min-w-0"><svg aria-hidden="true" class="w-8 h-8 text-blue-700" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l10 18H2z"/></svg><h2 class="text-lg font-semibold mt-2">Safe</h2><p class="text-slate-700">Checked before it runs.</p></div>
    <div class="border border-slate-300 rounded-xl p-4 min-w-0"><svg aria-hidden="true" class="w-8 h-8 text-blue-700" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg><h2 class="text-lg font-semibold mt-2">Private</h2><p class="text-slate-700">Nothing leaves your device.</p></div>
    <div class="border border-slate-300 rounded-xl p-4 min-w-0"><svg aria-hidden="true" class="w-8 h-8 text-blue-700" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14"/></svg><h2 class="text-lg font-semibold mt-2">Offline</h2><p class="text-slate-700">Works without a network.</p></div>
    <div class="border border-slate-300 rounded-xl p-4 min-w-0"><svg aria-hidden="true" class="w-8 h-8 text-blue-700" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22L2 4h20z"/></svg><h2 class="text-lg font-semibold mt-2">Open</h2><p class="text-slate-700">Readable by anyone.</p></div>
  </div>
</main>
</body>
</html>
