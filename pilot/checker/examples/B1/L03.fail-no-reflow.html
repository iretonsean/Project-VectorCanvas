<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="[overflow-wrap:anywhere] bg-white text-slate-900">
<main class="max-w-6xl mx-auto p-6 lg:p-12 grid grid-cols-1 gap-8 items-center">
  <div class="flex flex-col gap-4">
    <h1 class="text-4xl lg:text-5xl font-extrabold">Build apps that run anywhere</h1>
    <p class="text-lg text-slate-700">One small program, every screen. Describe what you want and ship it.</p>
    <div class="flex flex-wrap gap-3">
      <button class="bg-blue-700 text-white font-semibold rounded-lg px-5 py-3">Get started</button>
      <button class="border-2 border-blue-700 text-blue-800 rounded-lg px-5 py-3">Learn more</button>
    </div>
  </div>
  <svg aria-hidden="true" viewBox="0 0 400 300" class="w-full h-64 lg:h-80 rounded-xl bg-blue-50">
    <circle cx="200" cy="150" r="90" fill="#1d4ed8"/>
    <rect x="60" y="200" width="280" height="30" rx="15" fill="#93c5fd"/>
  </svg>
</main>
</body>
</html>
