<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile card</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 p-4">
<div class="w-80 max-w-full rounded-xl bg-slate-800 border border-slate-600 p-6 flex flex-col gap-4">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-full bg-blue-700 flex items-center justify-center text-white font-bold" aria-hidden="true">JD</div>
    <div>
      <h3 class="text-white font-bold text-sm">Jane Doe</h3>
      <p class="text-slate-300 text-xs">Product Designer</p>
    </div>
  </div>
  <p class="text-slate-200 text-sm leading-relaxed">Building the future of spatial computing via GPU pipelines.</p>
  <button class="w-full py-2.5 bg-teal-300 hover:bg-teal-200 text-slate-900 rounded-lg text-sm" onclick="window.__connected=true">Connect</button>
</div>
</body>
</html>
