<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="[overflow-wrap:anywhere] bg-white text-slate-900 p-4">
<main class="max-w-md mx-auto">
  <h1 id="h" class="text-2xl font-bold mb-4"></h1>
  <div id="body" class="mb-4"></div>
  <div class="flex gap-2"><button id="back" class="border border-slate-700 rounded px-3 py-1">Back</button><button id="next" class="bg-blue-700 text-white rounded px-3 py-1">Next</button></div>
</main>
<script>
  let step = 1, pet = null; const hist = [];
  const titles = { 1: 'Step 1: About you', 2: 'Step 2: Pet', 3: 'Step 3: Pet name', 4: 'Step 4: Summary' };
  function render() {
    document.getElementById('h').textContent = titles[step];
    const b = document.getElementById('body'); b.innerHTML = '';
    if (step === 1) b.innerHTML = '<label>Your name <input class="block w-full border border-slate-500 rounded px-2 py-1"></label>';
    if (step === 2) b.innerHTML = '<fieldset><legend>Do you have a pet?</legend><label><input type="radio" name="pet" value="yes"> Yes</label> <label><input type="radio" name="pet" value="no"> No</label></fieldset>';
    if (step === 3) b.innerHTML = '<label>Pet name <input class="block w-full border border-slate-500 rounded px-2 py-1"></label>';
    if (step === 4) b.textContent = 'All done.';
    b.querySelectorAll('input[name=pet]').forEach(r => { r.checked = pet === r.value; r.onchange = () => pet = r.value; });
    document.getElementById('back').hidden = hist.length === 0;
    document.getElementById('next').textContent = step === 4 ? 'Finish' : 'Next';
  }
  document.getElementById('next').onclick = () => { if (step === 4) return; hist.push(step); step = step === 2 && pet === 'no' ? 4 : step + 1; render(); };
  document.getElementById('back').onclick = () => { step = hist.pop(); render(); };
  render();
</script>
</body>
</html>
