<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PVC web host (Session 2, A5)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Same font files the runtime bundles (dev-render CHECKPOINT), so the overlay <input> lays text out like the canvas. */
  @font-face { font-family: 'DejaVu Sans'; src: url('fonts/DejaVuSans.ttf'); font-display: block; }
  @font-face { font-family: 'Noto Sans CJK SC'; src: url('fonts/NotoSansCJKsc-Regular.otf'); font-display: block; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  #pvc-canvas { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }
  /* Hidden semantics mirror: in the accessibility tree, not visible, not intercepting pointer
     events (except the real <input> overlays). opacity:0 keeps elements in Chromium's AX tree;
     display:none / visibility:hidden / aria-hidden would remove them. */
  #pvc-mirror { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; opacity: 0; pointer-events: none; }
  .pvcm { position: absolute; margin: 0; padding: 0; border: 0; box-sizing: border-box; background: transparent;
          color: transparent; overflow: visible; pointer-events: none; white-space: nowrap; font: 16px sans-serif; }
  .pvci { pointer-events: auto; overflow: hidden; text-rendering: geometricPrecision; /* unhinted, fractional advances = the runtime's Parley layout; 'auto' makes Chromium round advances (measured: +2.96 px over 12 chars) */ caret-color: transparent; outline: none; }
  /* ?debug=1 makes the mirror and the overlay visible (used by the caret-alignment check only). */
  body.pvc-debug #pvc-mirror { opacity: 1; }
  body.pvc-debug .pvci { outline: 1px solid rgba(255,0,255,.8); caret-color: #f0f; caret-animation: manual; color: rgba(255,0,255,.35); }
</style>
</head>
<body>
<canvas id="pvc-canvas" aria-hidden="true"></canvas>
<div id="pvc-mirror"></div>
<script type="module" src="boot.js"></script>
</body>
</html>
