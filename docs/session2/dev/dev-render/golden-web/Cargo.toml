[package]
name = "pvc-golden-web"
version = "0.0.1"
edition = "2021"
publish = false
# A7 harness (test tooling, not a shipped crate): replays the runtime's display list for the four golden
# states on vello_gpu's WebGL2 backend in a canvas and hands back the fingerprint; JS reads the pixels.

[lib]
crate-type = ["cdylib"]

[dependencies]
pvc-runtime = { path = "../pvc-runtime", features = ["webgl"] }
pvc-ir = { path = "../../dev-ir/pvc-ir" }
vello_gpu = { version = "=0.3.0", default-features = false, features = ["webgl", "text", "std"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "WebGl2RenderingContext"] }

[profile.release]
opt-level = 3
